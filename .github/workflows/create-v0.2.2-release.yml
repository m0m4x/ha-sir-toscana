name: Create v0.2.2 release

on:
  push:
    branches:
      - chore/create-v0.2.2-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.2 already exists."
            exit 0
          fi

          gh release create v0.2.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target 9b8474670225884ab9b0d023efa0511f2d070951 \
            --title "SIR CFR Toscana v0.2.2" \
            --notes-file - <<'EOF'
          SIR CFR Toscana v0.2.2

          - Rinominata l'integrazione da **SIR Toscana** a **SIR CFR Toscana** per identificare più chiaramente il servizio regionale.
          - Aggiornati i metadati HACS e Home Assistant.
          - Mantenuti invariati il domain `sir_toscana`, il repository e la compatibilità con le configurazioni esistenti.
          EOF
